<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contactanos para consultas sobre destinos turísticos argentinos.">
  <title>Contacto – Destinos Argentinos</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <header>
    <div class="contenedor-nav">
      <span class="logo">🇦🇷 Destinos Argentinos</span>
      <nav>
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="playa.html">Playa</a></li>
          <li><a href="montana.html">Montaña</a></li>
          <li><a href="contacto.html" class="activo">Contacto</a></li>
          <li><a href="mantenedor.html">Quién mantiene el sitio</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="seccion">
    <h1>📬 Contacto</h1>
    <p style="margin-bottom: 2rem; color: #555;">¿Tenés alguna consulta o sugerencia? Completá el formulario y te responderemos a la brevedad.</p>

    <form class="formulario" action="#" method="post">
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>

      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>

      <label for="asunto">Asunto</label>
      <select id="asunto" name="asunto">
        <option value="consulta">Consulta general</option>
        <option value="destino">Información sobre un destino</option>
        <option value="sugerencia">Sugerencia</option>
        <option value="otro">Otro</option>
      </select>

      <label for="mensaje">Mensaje</label>
      <textarea id="mensaje" name="mensaje" placeholder="Escribí tu mensaje acá..." required></textarea>

      <button type="submit" class="btn">Enviar mensaje</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Destinos Argentinos. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
