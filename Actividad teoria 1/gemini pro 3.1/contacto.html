<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turismo Argentino - Contacto</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header>
        <h1>Contacto</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="playa.html">Playa</a></li>
                <li><a href="montana.html">Montaña</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="mantenedor.html">Quién mantiene el sitio</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Envíanos un mensaje</h2>
            <form class="contacto-form" action="#" method="POST">
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" required></textarea>
                </div>
                <button type="submit" class="btn-enviar">Enviar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Turismo Argentino.</p>
    </footer>
</body>
</html>
